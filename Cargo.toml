[workspace]
resolver = "2"
members = [
    "bevy_asset_loader",
    "bevy_asset_loader_derive",
    "tests/no_bevy_dependency",
]

[workspace.lints.clippy]
doc_markdown = "warn"
redundant_else = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
map_flatten = "warn"
manual_let_else = "warn"
